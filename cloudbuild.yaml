# Solo construye y sube la imagen. El despliegue lo hace `make deploy`
# (la cuenta de Cloud Build no tiene permiso sobre Cloud Run).
substitutions:
  _REGION: us-east1
  _SERVICE: web-wcar
  _REPO: web-wcar
  _TAG: latest
  _API_BASE_URL: https://wcar-backend-163733969300.us-east1.run.app/api
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_TAG}
options:
  logging: CLOUD_LOGGING_ONLY
